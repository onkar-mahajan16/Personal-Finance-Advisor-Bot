services:
  - type: web
    name: ledgerly
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerly-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: ledgerly-db
    databaseName: ledgerly
    user: ledgerly
    plan: basic-256mb
